<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hebrew Verb Challenge</title><style>body{margin:0;font-family:Arial,sans-serif;background:#151d38;color:white;text-align:center}main{max-width:850px;margin:35px auto;padding:18px}.top{display:flex;justify-content:space-between;font-weight:bold}.question{background:#26355e;padding:32px 15px;border-radius:18px;font-size:clamp(24px,4vw,38px);margin:28px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{border:0;border-radius:13px;color:white;font-size:clamp(23px,4vw,35px);font-weight:bold;padding:30px 8px;cursor:pointer;min-height:125px}.answer:disabled{opacity:.7;cursor:default}.answer.correct{outline:5px solid #fff;opacity:1}.answer:nth-child(1){background:#db3e46}.answer:nth-child(2){background:#2477d3}.answer:nth-child(3){background:#d7a019}.answer:nth-child(4){background:#238f61}button.action{background:#fff;color:#17203d;border:0;border-radius:12px;padding:16px 35px;font-size:20px;font-weight:bold;cursor:pointer;margin:22px}.feedback{min-height:30px;font-size:23px;font-weight:bold}.small{color:#d3ddfa}#end{display:none}input{padding:12px;border-radius:8px;border:0;font-size:19px;max-width:85%}@media(max-width:500px){.grid{gap:9px}.answer{min-height:110px;padding:18px 4px}}</style></head><body><main><h1>🎮 Hebrew Verb Challenge</h1><p class="small">משחק הפעלים • Choose the correct infinitive</p><section id="start"><p>Enter your name (optional)</p><input id="name" placeholder="Student name"><br><button class="action" onclick="start()">Start Game ▶</button></section><section id="play" hidden><div class="top"><span id="progress"></span><span id="score"></span></div><div class="question" id="question"></div><div class="grid" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="action" id="next" hidden onclick="advance()">Next Question →</button></section><section id="end"><h2>🏆 כל הכבוד!</h2><h1 id="final"></h1><p id="message"></p><button class="action" onclick="start()">Play Again ↻</button></section></main><script>const data=[['I want to pay for my lunch.','לשלם','לבקש','לקבל','לבקר'],['I want to receive a gift.','לקבל','לצלצל','לסדר','לחפש'],['I want to ask for a Hanukkah gift.','לבקש','לדבר','לשלם','לטייל'],['I like to talk with my friends.','לדבר','לבקר','לסדר','לקבל'],['I want to hike in Israel.','לטייל','לחפש','לצלצל','לבקש'],['I need to search for my phone.','לחפש','לשלם','לבקר','לסדר'],['I want to organize my room.','לסדר','לקבל','לדבר','לטייל'],['I want to visit my grandmother.','לבקר','לבקש','לשלם','לצלצל'],['I want to call my friend.','לצלצל','לטייל','לחפש','לקבל']];let order=[],index=0,points=0,locked=false;const el=id=>document.getElementById(id);function start(){order=data.map(a=>[a[0],a.slice(1).map((s,i)=>({s,correct:i===0})).sort(()=>Math.random()-.5)]).sort(()=>Math.random()-.5);index=0;points=0;el('start').hidden=true;el('end').style.display='none';el('play').hidden=false;render()}function render(){locked=false;el('progress').textContent=`Question ${index+1} / ${order.length}`;el('score').textContent=`⭐ ${points} points`;el('question').textContent=order[index][0];el('feedback').textContent='';el('next').hidden=true;el('answers').replaceChildren();order[index][1].forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.dir='rtl';b.textContent=['▲ ','◆ ','● ','■ '][i]+o.s;b.onclick=()=>choose(i);el('answers').appendChild(b)})}function choose(i){if(locked)return;locked=true;const opts=order[index][1],buttons=[...el('answers').children];buttons.forEach((b,j)=>{b.disabled=true;if(opts[j].correct)b.classList.add('correct')});if(opts[i].correct){points+=100;el('feedback').textContent='✅ נכון! +100'}else{el('feedback').textContent='❌ התשובה הנכונה: '+opts.find(o=>o.correct).s}el('score').textContent=`⭐ ${points} points`;el('next').textContent=index===order.length-1?'See Results 🏆':'Next Question →';el('next').hidden=false}function advance(){index++;if(index<order.length){render();return}el('play').hidden=true;el('end').style.display='block';el('final').textContent=`${points} / ${order.length*100}`;const n=el('name').value.trim();el('message').textContent=(n?n+', ':'')+(points===900?'Excellent! You know all nine verbs!':points>=600?'Great work! Keep practicing!':'Review the verbs and try again!')} </script></body></html>
